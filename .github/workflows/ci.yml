name: CI

# Gate every push and PR on a clean type-check and a successful build, so the
# 53-errors-in-main situation can't recur. No app runtime / DB is needed for
# either step (tsc is --noEmit, the build is a static client bundle + esbuild
# server bundle), so this runs without any secrets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (client + server bundles)
        run: npm run build
